name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q stream_cipher.py cipher_variants.py stream_server.py tools tests

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/cipher.js
          node --check web/service-worker.js

      - name: Run grading tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test generator comparison
        run: python -m tools.compare_variants --bytes 4096 --tests monobit runs
